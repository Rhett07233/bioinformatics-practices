name: dna
channels:
  - conda-forge
  - bioconda
dependencies:
  # --- 下载 / 质控 ---
  - aria2
  - wget
  - fastp
  - fastqc
  - multiqc
  # --- 比对 / 处理 ---
  - bwa
  - samtools
  - htslib
  - bedtools
  - seqtk
  # --- 变异检测 / 注释 ---
  - bcftools
  - snpeff
  # --- 组装 / 基因内容注释（步骤 08 使用）---
  # 本样本的致病性来自 accessory genome（毒力岛、pAA 质粒），这些序列在 K-12
  # 参考里不存在，靠比对 + SNP 拿不到；要回答"为什么致病"必须先组装再做基因注释。
  - spades
  - abricate
  # --- 汇总图（步骤 07 使用）---
  # 把 matplotlib 放进本环境，07_summary_plot.py 就不必借用单细胞那边的 scanpy 环境。
  - matplotlib
